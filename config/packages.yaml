packages:
  pkg-config:
    externals:
    - spec: pkg-config@0.29.2
      prefix: /usr
    buildable: false
    require:
    - '%gcc'
  lustre:
    externals:
    - spec: lustre@2.15.4.2_cray_42_ga614b9c
      prefix: /usr
    buildable: false
    require:
    - '%gcc'
  openssl:
    externals:
    - spec: openssl@1.1.1l
      prefix: /usr
    buildable: false
    require:
    - certs=system
    - '%gcc'
  opencl:
    buildable: false
  cuda:
    externals:
    - spec: cuda@12.3.2
      prefix: /glade/u/apps/casper/24.12/spack/opt/spack/cuda/12.3.2/gcc/12.4.0/jw45
    - spec: cuda@12.6.3
      prefix: /glade/u/apps/casper/24.12/spack/opt/spack/cuda/12.6.3/gcc/12.4.0/r5og
    buildable: false
    require:
    - +allow-unsupported-compilers
    - '%gcc'
    variants:
    - +dev
  gcc:
    externals:
    - spec: gcc@7.5.0 languages='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
    - spec: gcc@12.4.0 languages='c,c++,fortran,go'
      prefix: /glade/u/apps/casper/24.12/spack/opt/spack/gcc/12.4.0/5b5c
      extra_attributes:
        compilers:
          c: /glade/u/apps/casper/24.12/spack/opt/spack/gcc/12.4.0/5b5c/bin/gcc
          cxx: /glade/u/apps/casper/24.12/spack/opt/spack/gcc/12.4.0/5b5c/bin/g++
          fortran: /glade/u/apps/casper/24.12/spack/opt/spack/gcc/12.4.0/5b5c/bin/gfortran
        environment:
          set:
            NVCCFLAGS: -allow-unsupported-compiler
            NVCC_PREPEND_FLAGS: -allow-unsupported-compiler
            # These are needed for kokkos (see kokkos_check_env.cmake)
            CRAYPE_VERSION: 1
            CRAYPE_LINK_TYPE: dynamic
    buildable: false
    variants:
    - +piclibs
    - languages=c,c++,fortran,go
    require:
    - '%gcc@7.5.0'
  adios2:
    variants:
    - +cuda
    - +hdf5
    - +python
  all:
    'compiler:':
    - gcc@12.4.0
    - gcc
    - oneapi
    - nvhpc
    - cce
    providers:
      'mpi:':
      - cray-mpich
      'szip:':
      - libszip
      'pkgconfig:':
      - pkg-config
      'lapack:':
      - openblas
      - intel-oneapi-mkl
      - cray-libsci
      - nvhpc
      'blas:':
      - openblas
      - intel-oneapi-mkl
      - cray-libsci
      - nvhpc
      'zlib-api:':
      - zlib
      'rpc:':
      - libtirpc
      tbb:
      - intel-oneapi-tbb
    permissions:
      read: world
      write: user
    target:
    # This target is lowest-common denominator between Intel and Milans
    - x86_64_v3
    prefer:
    # This should force packages to use the vendor-preferred solution
    # without needing to set it on each package UNLESS that package needs
    # to set its own preferences
    - spec: ^openblas
      when: '%gcc ^lapack'
    - spec: ^intel-oneapi-mkl
      when: '%oneapi ^lapack'
    - spec: ^nvhpc
      when: '%nvhpc ^lapack'
    - spec: ^cray-libsci
      when: '%cce ^lapack'
    - spec: ^openblas
      when: '%gcc ^blas'
    - spec: ^intel-oneapi-mkl
      when: '%oneapi ^blas'
    - spec: ^nvhpc
      when: '%nvhpc ^blas'
    - spec: ^cray-libsci
      when: '%cce ^blas'
    - spec: ^pkg-config
      when: ^pkgconfig
    - spec: ^zlib
      when: ^zlib-api
    - spec: cuda_arch=80 ^cuda@12.3.2
      when: ^cuda
    - spec: ^libfabric@1.15.2.0
      when: ^libfabric
    # Without these, these packages will use GCC versions
    # (not yet true for nvhpc/cce, but check when those runtimes are added)
    - spec: ^hdf5 %oneapi
      when: '%oneapi ^hdf5'
    - spec: ^netcdf-c %oneapi
      when: '%oneapi ^netcdf-c'
    # Try to motivate use of system libfabric for cray-mpich stuff
    - spec: ^libfabric@1.15.2.0
      when: ^libfabric ^cray-mpich@8.1.29
  antlr:
    require:
    - '%gcc'
  aocc:
