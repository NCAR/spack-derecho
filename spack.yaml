        prefix: /glade/u/apps/common/25.10/spack/opt/spack/intel-oneapi-vtune/2025.6.0/gcc/12.5.0/e3bw
    ioapi:
      require:
      - cflags=-Wno-error=implicit-function-declaration
    ip:
      prefer:
      - '%lapack=openblas'
    ispc:
      require:
