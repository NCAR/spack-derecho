    help2man:
      prefer:
      - '%gcc@12.5.0'
    hwloc:
      variants:
      - +cuda
      - +nvml
      prefer:
      - '%gcc@12.5.0'
    imagemagick:
      variants:
      - +ghostscript
    intel-oneapi-advisor:
      prefer:
      - '%gcc@12.5.0'
      buildable: false
      externals:
      - spec: intel-oneapi-advisor@2025.3.0
        prefix: /glade/u/apps/common/25.10/spack/opt/spack/intel-oneapi-advisor/2025.3.0/gcc/12.5.0/fyfp
    intel-oneapi-mkl:
