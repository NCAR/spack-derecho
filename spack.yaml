            - NCAR_ROOT_INTEL_ONEAPI_INSPECTOR
            - NCAR_SPACK_HASH_INTEL_ONEAPI_INSPECTOR
          environment:
            set:
              NCAR_ROOT_INTEL_INSPECTOR: '{prefix}'
              NCAR_SPACK_HASH_INTEL_INSPECTOR: '{hash}'
        intel-oneapi-mkl:
          template: ncar_math.lua
          filter:
            exclude_env_vars:
            - NCAR_LDFLAGS_INTEL_ONEAPI_MKL
            - NCAR_ROOT_INTEL_ONEAPI_MKL
            - NCAR_SPACK_HASH_INTEL_ONEAPI_MKL
          environment:
            set:
              NCAR_LDFLAGS_MKL: '{prefix}/mkl/{version}/lib/intel64'
              NCAR_ROOT_MKL: '{prefix}/mkl/{version}'
              NCAR_SPACK_HASH_MKL: '{hash}'
        intel-oneapi-mpi:
          filter:
            exclude_env_vars:
            - NCAR_ROOT_INTEL_ONEAPI_MPI
            - NCAR_SPACK_HASH_INTEL_ONEAPI_MPI
          environment:
            set:
              I_MPI_HYDRA_BOOTSTRAP: rsh
              I_MPI_HYDRA_BOOTSTRAP_EXEC: pbs_tmrsh
              I_MPI_OFI_PROVIDER: cxi
              # These settings help with Slingshot 11 buffer issues
              # See: https://docs.alcf.anl.gov/aurora/known-issues/#1-cassini-event-queue-overflow-detected
              FI_CXI_DEFAULT_CQ_SIZE: '131072'
              FI_CXI_OFLOW_BUF_SIZE: '12582912'
              #FI_CXI_CQ_FILL_PERCENT: '20'
              NCAR_ROOT_INTEL_MPI: '{prefix}'
              NCAR_SPACK_HASH_INTEL_MPI: '{hash}'
        intel-oneapi-vtune:
          filter:
            exclude_env_vars:
            - NCAR_ROOT_INTEL_ONEAPI_VTUNE
            - NCAR_SPACK_HASH_INTEL_ONEAPI_VTUNE
          environment:
            set:
              NCAR_ROOT_INTEL_VTUNE: '{prefix}'
              NCAR_SPACK_HASH_INTEL_VTUNE: '{hash}'
            append_path:
              LD_LIBRARY_PATH: '{prefix}/vtune/latest/lib64'
        kokkos:
          environment:
            set:
              Kokkos_ROOT: '{prefix}'
        lcov:
          environment:
            prepend_path:
              PATH: /glade/u/apps/derecho/25.10/opt/wrappers/{name}/{version}/{hash:4}/bin
        libfabric:
          environment:
            set:
              FI_PROVIDER_PATH: '{prefix}'
              I_MPI_OFI_LIBRARY: '{prefix}/lib64/libfabric.so.1'
        libtorch:
          filter:
            exclude_env_vars:
            - CMAKE_PREFIX_PATH
            - PATH
        matlab:
          environment:
            set:
              MW_FEATURE_MathworksServiceHostIsOnByDefault: '0'
        miniconda3:
          filter:
            exclude_env_vars:
            - ACLOCAL_PATH
            - CMAKE_PREFIX_PATH
            - CONDA_EXE
            - CONDA_PYTHON_EXE
            - CONDA_SHLVL
            - LD_LIBRARY_PATH
            - MANPATH
            - NCAR_INC_MINICONDA3
            - NCAR_LDFLAGS_MINICONDA3
            - NCAR_ROOT_MINICONDA3
            - PATH
            - PKG_CONFIG_PATH
            - _CE_CONDA
            - _CE_M
          environment:
            set:
              NCAR_ROOT_CONDA: '{prefix}'
          template: conda.lua
          conflict:
          - uv
          - pixi
        miniforge3:
          filter:
            exclude_env_vars:
            - ACLOCAL_PATH
            - CMAKE_PREFIX_PATH
            - CONDA_EXE
            - CONDA_PYTHON_EXE
            - CONDA_SHLVL
            - LD_LIBRARY_PATH
            - MANPATH
            - NCAR_INC_MINIFORGE3
            - NCAR_LDFLAGS_MINIFORGE3
            - NCAR_ROOT_MINIFORGE3
            - PATH
            - PKG_CONFIG_PATH
            - _CE_CONDA
            - _CE_M
            - _CONDA_EXE
            - _CONDA_ROOT
            - MAMBA_ROOT_PREFIX
          environment:
            set:
              NCAR_ROOT_CONDA: '{prefix}'
          template: conda.lua
          conflict:
          - uv
          - pixi
        uv:
          conflict:
          - conda
          - pixi
          environment:
            set:
              UV_CACHE_DIR: /glade/derecho/scratch/" .. os.getenv("USER") .. "/.cache/uv
              #XDG_CACHE_HOME: '/glade/derecho/scratch/" .. os.getenv("USER") .. "/.cache'
        pixi:
          conflict:
          - conda
          - uv
          environment:
            set:
              PIXI_CACHE_DIR: /glade/derecho/scratch/" .. os.getenv("USER") .. "/.cache/pixi
              RATTLER_CACHE_DIR: /glade/derecho/scratch/" .. os.getenv("USER") .. "/.cache/pixi/rattler
        mpi:
          template: ncar_wrapper_mpi.lua
          environment:
            set:
              NCAR_BUILD_ENV_MPI: derecho-{compiler.name}-{compiler.version}-{name}-{version}
              NCAR_ID_MPI: '{name}-{version}'
              NCAR_ROOT_MPI: '{prefix}'
        ncarcompilers:
          environment:
            set:
              NCAR_EXCLUDE_ASNEEDED: '1'
          template: ncar_wrapper.lua
        nccmp:
          autoload: none
          environment:
            set:
              HDF5_PLUGIN_PATH: '{^netcdf-c.prefix}/plugins'
        nco:
          autoload: none
        ncview:
          autoload: none
        neovim:
          template: ncar_neovim.lua
        netcdf:
          autoload: all
        netcdf+mpi:
          conflict:
          - netcdf
        netcdf~mpi:
          conflict:
          - netcdf+mpi
        nvhpc:
          environment:
            set:
              CRAY_NVIDIA_VERSION: '{version}'
              NCAR_BUILD_ENV: derecho-{name}-{version}
              NCAR_BUILD_ENV_COMPILER: derecho-{name}-{version}
              NCAR_ID_COMPILER: '{name}-{version}'
              NCAR_ROOT_COMPILER: '{prefix}'
              NVIDIA_PATH: '{prefix}'
              NVIDIA_VERSION: '{version}'
              PE_ENV: NVIDIA
            prepend_path:
              LD_LIBRARY_PATH: '{prefix}/Linux_x86_64/{version}/compilers/lib'
        nvhpc@21.3:
          environment:
            set:
              CRAY_CPU_TARGET: x86-rome
        octave:
          autoload: none
        openmpi:
          environment:
            set:
              FI_LNX_PROV_LINKS: cxi+shm
              FI_PROVIDER: cxi+shm:lnx
              # These settings help with Slingshot 11 buffer issues
              # See: https://docs.alcf.anl.gov/aurora/known-issues/#1-cassini-event-queue-overflow-detected
              FI_CXI_DEFAULT_CQ_SIZE: '131072'
              FI_CXI_OFLOW_BUF_SIZE: '12582912'
              #FI_CXI_CQ_FILL_PERCENT: '20'
              OMPI_MCA_rmaps_default_mapping_policy: :hwtcpus
              OMPI_MCA_shmem_mmap_enable_nfs_warning: '0'
              PRTE_MCA_prte_tmpdir_base: /tmp
              # Open MPI puts Fortran modules in an atypical place
              # https://github.com/open-mpi/ompi/issues/12600
              NCAR_INC_OPENMPIMOD: '{prefix}/lib'
            prepend_path:
              LD_LIBRARY_PATH: '{prefix}/lib'
        parallel-netcdf:
          environment:
            set:
              PNETCDF: '{prefix}'
        parallelio:
          environment:
            set:
              PIO: '{prefix}'
        parallelio+mpi:
          conflict:
          - parallelio-serial
          - mpi-serial
        parallelio~mpi:
          conflict:
          - parallelio
          - cray-mpich
          - openmpi
        parallelio1:
          filter:
            exclude_env_vars:
            - NCAR_INC_PARALLELIO1
            - NCAR_LDFLAGS_PARALLELIO1
            - NCAR_ROOT_PARALLELIO1
            - NCAR_SPACK_HASH_PARALLELIO1
          environment:
            set:
              NCAR_INC_PARALLELIO: '{prefix}/include'
              NCAR_LDFLAGS_PARALLELIO: '{prefix}/lib'
              NCAR_ROOT_PARALLELIO: '{prefix}'
              NCAR_SPACK_HASH_PARALLELIO: '{hash}'
              PIO: '{prefix}'
        projections:
          all: '{name}/{version}'
          fftw+mpi: fftw-mpi/{version}
          netcdf+mpi+debug: netcdf-mpi/{version}-debug
          netcdf+mpi: netcdf-mpi/{version}
          hdf5+mpi: hdf5-mpi/{version}
          esmf+mpi+debug: esmf-mpi/{version}-debug
          esmf+mpi: esmf-mpi/{version}
          parallelio~mpi: parallelio-serial/{version}
          netcdf: netcdf/{version}
          intel-oneapi-advisor: intel-advisor/{version}
          intel-oneapi-compilers@2024: intel-oneapi/{version}
          intel-oneapi-compilers@2025: intel/{version}
          intel-oneapi-inspector: intel-inspector/{version}
          intel-oneapi-mpi: intel-mpi/{version}
          intel-oneapi-mkl: mkl/{version}
          intel-oneapi-vtune: intel-vtune/{version}
          miniconda3: conda/latest
          miniforge3: conda/latest
          pixi: pixi/latest
          uv: uv/latest
          parallelio1: parallelio/{version}
          parallelio~shared: parallelio/{version}-static
          py-torch: libtorch/{version}
          cppflags=-g: '{name}/{version}-debug'
          build_type=Debug: '{name}/{version}-debug'
          +debug: '{name}/{version}-debug'
        podman:
          environment:
            set:
              CONTAINERS_STORAGE_CONF: /glade/u/apps/etc/containers/storage.conf
        rstudio:
          filter:
            exclude_env_vars:
            - CMAKE_PREFIX_PATH
          environment:
            prepend_path:
              PATH: '{prefix}'
        singularityce:
          environment:
            prepend_path:
              PATH: '{^squashfs.prefix}/bin'
          filter:
            exclude_env_vars:
            - GOPATH
