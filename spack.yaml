      - +libwebp
      - +libx264
      - +libxml2
      - +libzma
      - +libzmq
      - +sdl2
    fftw:
      variants:
      - ~mpi
    findutils:
      prefer:
      - '%gcc@12.5.0'
    flatbuffers:
      prefer:
      - '%gcc@12.5.0'
    flex:
      prefer:
      - '%gcc@12.5.0'
    gawk:
      prefer:
      - '%gcc@12.5.0'
    go-or-gccgo-bootstrap:
      prefer:
      - go-bootstrap
      buildable: true
    golang:
      buildable: true
    gdal:
      require:
      - spec: ^hdf5~mpi
        when: +hdf5
      variants:
      - +blosc
      - +curl
      - +deflate
      - +expat
      - +geos
      - +gif
      - +grib
      - +hdf5
      - +iconv
      - +jpeg
      - +libaec
      - +libcsf
      - +liblzma
      - +libxml2
      - +lz4
      - +netcdf
      - +openjpeg
      - +parquet
      - +pcidsk
      - +pdfium
      - +png
      - +qhull
      - +sqlite3
      - +webp
      - +zstd
      - ~hdf4
    gdb:
      variants:
      - +gold
      - +ld
      - +lto
      - +source-highlight
      - +tui
      - ~debuginfod
      - ~python
      prefer:
      - '%gcc@12.5.0'
    gdbm:
      prefer:
      - '%gcc@12.5.0'
    gettext:
      prefer:
      - '%gcc@12.5.0'
      - spec: +libxml2
        when: '%gcc@8:'
    git:
      variants:
      - +svn
      - +tcltk
      prefer:
      - '%gcc@12.5.0'
    glx:
