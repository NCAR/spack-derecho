# *** SLES Derecho Software Stack ***
spack:
  config:
    install_tree:
      projections:
        c: '{name}/{version}/{hash:4}'
        netcdf-c^mpi: netcdf/{version}/packages/{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-c: netcdf/{version}/packages/{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-cxx4^mpi: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-cxx4: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-fortran^mpi: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}
        netcdf-fortran: netcdf/{^netcdf-c.version}/packages/{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}
        ^mpi: '{name}/{version}/{^mpi.name}/{^mpi.version}/{compiler.name}/{compiler.version}/{hash:4}'
        ^c: '{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}'
        ^cxx: '{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}'
        ^fortran: '{name}/{version}/{compiler.name}/{compiler.version}/{hash:4}'
        all: '{name}/{version}/{hash:4}'
    build_jobs: 4
    test_stage: /glade/derecho/scratch/$user/temp/spack/derecho/25.10/tests
    source_cache: /glade/derecho/scratch/$user/temp/spack/cache
    misc_cache: /glade/derecho/scratch/$user/temp/spack/derecho/25.10/misc
    build_stage:
    - /glade/derecho/scratch/$user/temp/spack/derecho/25.10/builds
    shared_linking:
    # Turning bind setting on would be beneficial but vendor compilers do not
    # seem to work with it! Avoid!
      type: rpath
      bind: false
    template_dirs:
    - /glade/u/apps/derecho/25.10/envs/build/templates/modules
  env_vars:
    set:
      NVCCFLAGS: -allow-unsupported-compiler
      NVCC_PREPEND_FLAGS: -allow-unsupported-compiler
  packages:
    pkg-config:
      externals:
      - spec: pkg-config@0.29.2
        prefix: /usr
      buildable: false
    lustre:
      externals:
      - spec: lustre@2.15.6.1_cray_100_g2c66dd0
        prefix: /usr
      buildable: false
    openssl:
      externals:
      - spec: openssl@1.1.1w-fips
        prefix: /usr
      - spec: openssl@3.1.4
        prefix: /usr
      buildable: false
      require:
      - certs=system
    gcc:
      externals:
      - spec: gcc@14.3.0 languages:='c,c++,fortran,go'
        prefix: /glade/u/apps/common/25.10/spack/opt/spack/gcc/14.3.0/nw2m
        extra_attributes:
          compilers:
            c: /glade/u/apps/common/25.10/spack/opt/spack/gcc/14.3.0/nw2m/bin/gcc
            cxx: /glade/u/apps/common/25.10/spack/opt/spack/gcc/14.3.0/nw2m/bin/g++
            fortran: /glade/u/apps/common/25.10/spack/opt/spack/gcc/14.3.0/nw2m/bin/gfortran
      - spec: gcc@12.5.0 languages:='c,c++,fortran,go'
        prefix: /glade/u/apps/common/25.10/spack/opt/spack/gcc/12.5.0/hsbg
        extra_attributes:
          compilers:
            c: /glade/u/apps/common/25.10/spack/opt/spack/gcc/12.5.0/hsbg/bin/gcc
            cxx: /glade/u/apps/common/25.10/spack/opt/spack/gcc/12.5.0/hsbg/bin/g++
            fortran: /glade/u/apps/common/25.10/spack/opt/spack/gcc/12.5.0/hsbg/bin/gfortran
      - spec: gcc@7.5.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc
            cxx: /usr/bin/g++
            fortran: /usr/bin/gfortran
      - spec: gcc@12.3.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-12
            cxx: /usr/bin/g++-12
            fortran: /usr/bin/gfortran-12
      - spec: gcc@13.3.1 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-13
            cxx: /usr/bin/g++-13
            fortran: /usr/bin/gfortran-13
      - spec: gcc@14.2.0 languages:='c,c++,fortran'
        prefix: /usr
        extra_attributes:
          compilers:
            c: /usr/bin/gcc-14
            cxx: /usr/bin/g++-14
            fortran: /usr/bin/gfortran-14
      buildable: false
      prefer:
      - spec: '%gcc@7.5.0'
        when: '@:12'
      - spec: '%gcc@12.5.0'
        when: '@13:'
      variants:
      - +piclibs
      - languages=c,c++,fortran,go
    pixi:
      externals:
      - spec: pixi@1.0.0
        prefix: /glade/u/apps/opt/pixi
      buildable: false
    uv:
      externals:
      - spec: uv@1.0.0
        prefix: /glade/u/apps/opt/uv
      buildable: false
    miniconda3:
      externals:
      - spec: miniconda3@25.5.1
        prefix: /glade/u/apps/opt/conda
      buildable: false
    miniforge3:
      externals:
      - spec: miniforge3@25.11
        prefix: /glade/u/apps/opt/miniforge/default
      buildable: false
    cuda:
      externals:
      - spec: cuda@12.9.0
        prefix: /glade/u/apps/common/25.10/spack/opt/spack/cuda/12.9.0/b74h
      buildable: false
      require:
      - +allow-unsupported-compilers
      variants:
      - +dev
    opencl:
      buildable: false
    nvhpc:
      require:
      - +blas
      - +lapack
      - ~mpi
      prefer:
      - '%gcc@12.5.0'
      buildable: false
      externals:
      - spec: nvhpc@25.9
        prefix: /glade/u/apps/casper/24.12/spack/opt/spack/nvhpc/25.9/gcc/12.4.0/luur
        extra_attributes:
          compilers:
            c: /glade/u/apps/casper/24.12/spack/opt/spack/nvhpc/25.9/gcc/12.4.0/luur/Linux_x86_64/25.9/compilers/bin/nvc
            cxx: /glade/u/apps/casper/24.12/spack/opt/spack/nvhpc/25.9/gcc/12.4.0/luur/Linux_x86_64/25.9/compilers/bin/nvc++
            fortran: /glade/u/apps/casper/24.12/spack/opt/spack/nvhpc/25.9/gcc/12.4.0/luur/Linux_x86_64/25.9/compilers/bin/nvfortran
    intel-oneapi-compilers:
      variants:
      - +nvidia
      prefer:
      - '%gcc@12.5.0'
      buildable: false
      externals:
      - spec: intel-oneapi-compilers@2024.2.1
        prefix: /glade/u/apps/casper/24.12/spack/opt/spack/intel-oneapi-compilers/2024.2.1/gcc/12.4.0/iq3b
        extra_attributes:
          compilers:
            c: /glade/u/apps/casper/24.12/spack/opt/spack/intel-oneapi-compilers/2024.2.1/gcc/12.4.0/iq3b/compiler/2024.2/bin/icx
            cxx: /glade/u/apps/casper/24.12/spack/opt/spack/intel-oneapi-compilers/2024.2.1/gcc/12.4.0/iq3b/compiler/2024.2/bin/icpx
            fortran: /glade/u/apps/casper/24.12/spack/opt/spack/intel-oneapi-compilers/2024.2.1/gcc/12.4.0/iq3b/compiler/2024.2/bin/ifx
      - spec: intel-oneapi-compilers@2025.2.1
        prefix: /glade/u/apps/common/25.10/spack/opt/spack/intel-oneapi-compilers/2025.2.1/s4f2
        extra_attributes:
          compilers:
            c: /glade/u/apps/common/25.10/spack/opt/spack/intel-oneapi-compilers/2025.2.1/s4f2/compiler/2025.2/bin/icx
            cxx: /glade/u/apps/common/25.10/spack/opt/spack/intel-oneapi-compilers/2025.2.1/s4f2/compiler/2025.2/bin/icpx
            fortran: /glade/u/apps/common/25.10/spack/opt/spack/intel-oneapi-compilers/2025.2.1/s4f2/compiler/2025.2/bin/ifx
    pkgconfig:
      buildable: false
      prefer:
      - pkg-config
    c:
      buildable: true
    cxx:
      buildable: true
    fortran:
      buildable: true
    cce:
      externals:
      - spec: cce@19.0.0
        prefix: /opt/cray/pe/cce/19.0.0
        extra_attributes:
          compilers:
            c: /opt/cray/pe/cce/19.0.0/bin/craycc
            cxx: /opt/cray/pe/cce/19.0.0/bin/crayCC
            fortran: /opt/cray/pe/cce/19.0.0/bin/crayftn
          environment:
            set:
              CRAYPE_LINK_TYPE: dynamic
      buildable: false
    libfabric:
      externals:
      - spec: libfabric@1.22.0 fabrics=cxi,shm,tcp,udp
        prefix: /opt/cray/libfabric/1.22.0
      - spec: libfabric@1.15.2 fabrics=cxi,tcp,udp
        prefix: /opt/cray/libfabric/1.15.2.0
      variants:
      - +gdrcopy
      - +cuda
      - +uring
      - fabrics=sockets,tcp,udp,cxi,rxm,rxd,mrail,shm,lnx
      prefer:
      - spec: '%gcc@12.5.0'
        when: '@2:'
      - spec: '%gcc@7.5.0'
        when: '@1'
    adios2:
      variants:
      - +cuda
      - +hdf5
      - +python
    all:
      permissions:
        read: world
        write: user
      target:
      # This target is lowest-common denominator between Intel and Milans
      - x86_64_v3
      prefer:
      - +pic
      - spec: ^hdf5 %gcc@12.5.0
        when: '%gcc@12.5.0 ^hdf5'
      - spec: ^udunits %gcc@12.5.0
        when: '%gcc@12.5.0 ^udunits'
      - spec: ^openblas %gcc@12.5.0
        when: '%gcc@12.5.0 ^openblas'
      - spec: ^hdf5 %gcc@14.3.0
        when: '%gcc@14.3.0 ^hdf5'
      - spec: ^udunits %gcc@14.3.0
        when: '%gcc@12.5.0 ^udunits'
      - spec: ^openblas %gcc@14.3.0
        when: '%gcc@14.3.0 ^openblas'
      require:
      - spec: cuda_arch=80
        when: ^cuda
    antlr:
      prefer:
      - '%gcc@12.5.0'
    aocc:
      require:
      - +license-agreed
    apptainer:
      prefer:
      - '%gcc@12.5.0'
    arpack-ng:
      variants:
      - ~mpi
    arrow:
      prefer:
      - '%gcc@12.5.0'
    assimp:
      prefer:
      - '%gcc@12.5.0'
    automake:
      prefer:
      - '%gcc@12.5.0'
    bash:
      prefer:
      - '%gcc@12.5.0'
    berkeley-db:
      prefer:
      - '%gcc@12.5.0'
    bison:
      prefer:
      - '%gcc@12.5.0'
    bzip2:
      prefer:
      - '%gcc@12.5.0'
    c-blosc:
      prefer:
      - '%gcc@12.5.0'
    cairo:
      variants:
      - +X
      - +fc
      - +ft
      - +gobject
      - +pdf
      - +png
      - +svg
      - +zlib
      prefer:
      - '%gcc@12.5.0'
    cdo:
      variants:
      - +curl
      prefer:
      - '%gcc@12.5.0'
      - ^udunits %gcc@12.5.0
    charliecloud:
      prefer:
      - '%gcc@12.5.0'
    cmake:
      variants:
      - +ownlibs
      prefer:
      - '%gcc@12.5.0'
    cmor:
      prefer:
      - '%gcc@12.5.0'
      - ^udunits %gcc@12.5.0
    cp2k:
      variants:
      - +elpa
      - +libvori
      - +plumed
      - +spglib
    cray-libsci:
      externals:
      - spec: cray-libsci@25.03.0 %cce
        prefix: /opt/cray/pe/libsci/25.03.0/CRAY/17.0/x86_64
      - spec: cray-libsci@25.03.0 %gcc
        prefix: /opt/cray/pe/libsci/25.03.0/GNU/12.3/x86_64
      - spec: cray-libsci@25.03.0 %nvhpc
        prefix: /opt/cray/pe/libsci/25.03.0/NVIDIA/23.3/x86_64
      - spec: cray-libsci@25.03.0 %intel-oneapi-compilers
        prefix: /opt/cray/pe/libsci/25.03.0/INTEL/2025.0/x86_64
      buildable: false
    cray-mpich:
      externals:
      - spec: cray-mpich@8.1.32 %gcc
        prefix: /opt/cray/pe/mpich/8.1.32/ofi/gnu/12.3
        extra_attributes:
          environment:
            append_path:
              LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
      - spec: cray-mpich@8.1.32 %cce
        prefix: /opt/cray/pe/mpich/8.1.32/ofi/cray/17.0
        extra_attributes:
          environment:
            append_path:
              LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
      - spec: cray-mpich@8.1.32 %nvhpc
        prefix: /opt/cray/pe/mpich/8.1.32/ofi/nvidia/23.3
        extra_attributes:
          environment:
            append_path:
              LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
      - spec: cray-mpich@8.1.32 %intel-oneapi-compilers
        prefix: /opt/cray/pe/mpich/8.1.32/ofi/intel/2022.1
        extra_attributes:
          environment:
            append_path:
              LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
      - spec: cray-mpich@9.0.0 %gcc
        prefix: /opt/cray/pe/mpich/9.0.0/ofi/gnu/12.3
        extra_attributes:
          environment:
            append_path:
              LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
      - spec: cray-mpich@9.0.0 %cce
        prefix: /opt/cray/pe/mpich/9.0.0/ofi/cray/17.0
        extra_attributes:
          environment:
            append_path:
              LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
      - spec: cray-mpich@9.0.0 %nvhpc
        prefix: /opt/cray/pe/mpich/9.0.0/ofi/nvidia/23.3
        extra_attributes:
          environment:
            append_path:
              LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
      - spec: cray-mpich@9.0.0 %intel-oneapi-compilers
        prefix: /opt/cray/pe/mpich/9.0.0/ofi/intel/2022.1
        extra_attributes:
          environment:
            append_path:
              LD_LIBRARY_PATH: /opt/cray/libfabric/1.22.0/lib64
      prefer:
      - +cuda
      - cuda_arch=80
      buildable: false
    curl:
      variants:
      - +libidn2
      - +libssh
      - +libssh2
      - +nghttp2
      prefer:
      - tls=openssl
      - '%gcc@12.5.0'
    darshan-runtime:
      variants:
      - +parallel-netcdf
      - scheduler=pbs
      require:
      - spec: ^hdf5+mpi
        when: +hdf5
      prefer:
      - spec: cflags='-std=gnu17 -Wno-error=implicit-function-declaration -Wno-error=int-conversion'
        when: '%gcc@15'
    darshan-util:
      variants:
      - +bzip2
      prefer:
      - '%gcc@12.5.0'
    dbus:
      prefer:
      - '%gcc@12.5.0'
    diffutils:
      prefer:
      - '%gcc@12.5.0'
    doxygen:
      variants:
      - +graphviz
    eccodes:
      variants:
      - +fortran
      - +png
      - +tools
      - jp2k=jasper
      require:
      - +netcdf
    ecflow:
      require:
      - +pic
      - +ui
      prefer:
      - '%gcc@12.5.0'
    eigen:
